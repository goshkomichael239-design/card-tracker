name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Launcher icon
        run: cp -r tools/android-icons/res/. android/app/src/main/res/
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Card-Tracker.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: Card-Tracker.apk
